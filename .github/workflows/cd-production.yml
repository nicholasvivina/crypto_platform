name: Deploy Production

on:
  push:
    tags: ['v*.*.*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & push Docker images
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cryptonex-backend:${{ github.ref_name }} ./backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cryptonex-frontend:${{ github.ref_name }} ./frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cryptonex-ai:${{ github.ref_name }} ./ai-service
          docker push ${{ secrets.DOCKER_USERNAME }}/cryptonex-backend:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cryptonex-frontend:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cryptonex-ai:${{ github.ref_name }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/cryptonex
            git pull origin main
            export TAG=${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec backend node scripts/db/indexes.js
            bash scripts/deploy/healthcheck.sh
